[my_right_shift]
t = A-C-6
a = A-C-4
s = A-C-1
d = A-C-2
f = A-C-5
g = A-C-3

[my_left_shift]
j = M-left
k = M-down
l = M-up
; = M-right

[mini_pairs]
w = macro( ` 10ms ` 10ms left )
e = macro( - 10ms - 10ms left )
r = macro( _ 10ms _ 10ms left )
