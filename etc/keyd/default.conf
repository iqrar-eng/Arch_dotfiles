s = macro( [ 10ms ] 10ms left )
d = macro( ( 10ms ) 10ms left )
f = macro( { 10ms } 10ms left )
g = macro( " 10ms " 10ms left )
x = macro( * 10ms * 10ms left )
c = macro( delete 10ms backspace )
v = macro( ' 10ms ' 10ms left )
space = macro( space 10ms space 10ms left )

[my_seven]
5 = M-A-C-S-p
6 = M-A-C-S-o
8 = macro( 5 30ms 4 30ms 0 30ms 7 30ms 2 30ms 5 )
9 = M-A-C-S-u
