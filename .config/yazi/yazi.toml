# https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml

# A TOML linter such as Tombi can use this schema to validate your config.
# If you encounter any problems, please file an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
show_hidden    = true
linemode       = "size"
mouse_events   = [ "click", "scroll", "drag" ]

[input]
cursor_blink = true

[which]
sort_by      	 = "desc"

[plugin]
prepend_preloaders = [
  # Do not preload files in mounted locations:
  # Environment variable won't work here.
  # Using absolute path instead.
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },

  # For mounted hard disk/drive
  { url = "/run/media/iqrar/**/*", run = "noop" },

  # You can also use glob pattern to match paths
  { url = "/run/user/*/gvfs/google-drive:host=gmail.com,user=*/**/*", run = "noop", prio = "high" },
  { url = "/run/user/*/gvfs/google-drive:host=gmail.com,user=*/**/*/", run = "noop", prio = "high" },
]
prepend_previewers = [
  # Allow to preview folder.
  { url = "*/", run = "folder" },

  # Do not previewing files in mounted locations.
  # Uncomment the line below to allow previewing text files.
  { mime = "{text/*,application/x-subrip}", run = "code" },

  # Using absolute path.
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },

  # For mounted hard disk/drive.
  { url = "/run/media/iqrar/**/*", run = "noop" },

  # You can also use glob pattern to match paths
  { url = "/run/user/*/gvfs/google-drive:host=gmail.com,user=*/**/*", run = "noop", prio = "high" },
  { url = "/run/user/*/gvfs/google-drive:host=gmail.com,user=*/**/*/", run = "noop", prio = "high" },
]
