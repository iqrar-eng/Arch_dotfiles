# vim:ft=kitty

## name:     Catppuccin Kitty Latte
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/latte.conf
## blurb:    Soothing pastel theme for the high-spirited!

# The basic colors
foreground              #000000
background              #FFFFFF
selection_background    #fff2de
selection_foreground    none

# Cursor colors
cursor                  #ff0000
cursor_text_color       #ffffff

# Scrollbar colors
scrollbar_handle_color  #7c7f93
scrollbar_track_color   #bcc0cc

# URL color when hovering with mouse
url_color               #dc8a78

# Colors for marks (marked text in the terminal)
mark1_foreground #eff1f5
mark1_background #7287fd
mark2_foreground #eff1f5
mark2_background #8839ef
mark3_foreground #eff1f5
mark3_background #209fb5

# The 16 terminal colors

# black
color0 #5c5f77
color8 #6c6f85

# red
color1 #d20f39
color9 #d20f39

# green
color2  #40a02b
color10 #40a02b

# yellow
color3  #df8e1d
color11 #df8e1d

# blue
color4  #1e66f5
color12 #1e66f5

# magenta
color5  #ea76cb
color13 #ea76cb

# cyan
color6  #179299
color14 #179299

# white
color7  #acb0be
color15 #bcc0cc
