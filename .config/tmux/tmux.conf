unbind C-b
set -g prefix C-g
bind C-g send-prefix

bind-key M-enter switch-client -T my-table
bind-key -T my-table a display-popup -E -w 100% -h 100% -B "~/dotfiles/.config/tmux/bin/which-key"
bind-key -T my-table b run-shell -b "~/dotfiles/.config/tmux/bin/reload-kitty"

bind-key -n C-t new-window -c "#{pane_current_path}"
bind-key -n C-S-t new-window -c ~
bind-key -n M-C-_ last-window
bind-key -n C-w kill-window
bind r run "tmux source ~/.tmux.conf" \; display "tmux.conf sourced"

bind-key c run-shell -b "tmux set-buffer '#{pane_current_path}' && tmux save-buffer - | wl-copy"

bind-key s run-shell -b "~/dotfiles/.config/tmux/bin/capture-prompt current"
bind-key enter run-shell -b "~/dotfiles/.config/tmux/bin/capture-prompt previous"
bind-key a run-shell -b "~/dotfiles/.config/tmux/bin/capture-context view"
bind-key d run-shell -b "~/dotfiles/.config/tmux/bin/capture-context buffer"

# ========================

bind -T copy-mode-vi . send-keys -X jump-to-mark
bind -T copy-mode-vi 0 send-keys -X set-mark

bind -T copy-mode-vi s send-keys -X copy-selection
bind -T copy-mode-vi c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi p send-keys -X copy-pipe-and-cancel "tmux paste-buffer -p"
bind -T copy-mode-vi d send-keys -X copy-pipe-and-cancel "hyprctl dispatch 'hl.dsp.focus({ workspace = \"1\" })' >/dev/null \
  && ~/dotfiles/.config/hypr/bin/paste"

bind PPage  copy-mode \; send-keys -X page-up
bind NPage  copy-mode \; send-keys -X page-down

bind -T copy-mode-vi /  command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward-incremental "%%" }
bind -T copy-mode-vi ?  command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)"   { send-keys -X search-backward-incremental "%%" }
bind /  copy-mode \; command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward-incremental "%%" }
bind ?  copy-mode \; command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)"   { send-keys -X search-backward-incremental "%%" }

bind h  copy-mode \; send-keys -X cursor-left
bind j  copy-mode \; send-keys -X cursor-down
bind k  copy-mode \; send-keys -X cursor-up
bind l  copy-mode \; send-keys -X cursor-right

bind e  copy-mode \; send-keys -X next-word-end
bind E  copy-mode \; send-keys -X next-space-end

bind n  copy-mode \; send-keys -X search-again
bind N  copy-mode \; send-keys -X search-reverse

bind C-End copy-mode \; send-keys -X history-bottom
bind C-Home copy-mode \; send-keys -X history-top
bind -T copy-mode-vi C-Home send-keys -X history-top
bind -T copy-mode-vi C-End  send-keys -X history-bottom

bind Home  copy-mode \; send-keys -X start-of-line
bind End   copy-mode \; send-keys -X end-of-line

bind v    copy-mode \; send-keys -X begin-selection
bind V    copy-mode \; send-keys -X begin-selection \; send-keys -X select-line
bind C-v  copy-mode \; send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

bind \{ copy-mode \; send-keys -X previous-paragraph
bind \} copy-mode \; send-keys -X next-paragraph
bind B  copy-mode \; send-keys -X previous-space
bind W  copy-mode \; send-keys -X next-space
bind ^  copy-mode \; send-keys -X back-to-indentation
bind b  copy-mode \; send-keys -X previous-word
bind w  copy-mode \; send-keys -X next-word

bind *   copy-mode \; send-keys -FX search-forward "#{copy_cursor_word}"
bind \#  copy-mode \; send-keys -FX search-backward "#{copy_cursor_word}"

# ========================

set -g allow-passthrough all
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 5000
set -q -g status-utf8 on
setw -q -g utf8 on
set -sg escape-time 1
set -g status-keys vi
set -g mode-keys vi
set -g monitor-activity on
set -g visual-activity off
set -g extended-keys on
set -g renumber-windows on
set -g status off
set -g status-position top

set -g @plugin 'roosta/tmux-fuzzback'
set -g @fuzzback-table 'prefix'
set -g @fuzzback-bind 'C-f'
set -g @fuzzback-popup 1
set -g @fuzzback-finder-bind 'focus:show-preview'
set -g @fuzzback-popup-size '100%'
set -g @fuzzback-finder-layout 'reverse'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '0'

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
